# source: https://github.com/mattpocock/skills
id: matt-pocock-wayfinder-workflow.zh
name: Matt-Pocock-工程工作流
type: dag
output_schema: {}
description: Wayfinder：一次选择地图中的全部开放 decision tickets，并让每个 ticket 在发现新前置决策时独立分裂和递归。
dag:
  - id: collect-workflow-input
    type: node
    node_kind: form
    output_schema:
      request: string
    description: 填写本次工作流的真实需求。
  - id: draw-wayfinder
    name: 绘制-Wayfinder-地图
    type: dag
    input_schema: &a1
      request: string
    output_schema: &a2
      map_reference: string
      requires_wayfinding: boolean
    dag:
      - id: draw-wayfinder-session
        name: 绘制-Wayfinder-地图-session
        type: node
        node_kind: agent
        input_schema: *a1
        prompt: >-
          本次输入：

          request: {{ request }}


          调用 $.wayfinder，使用“Chart the map”模式处理输入中的工程需求。确定 destination，创建唯一归属于当前
          workflow 的 Wayfinder map，并创建当前能够明确描述的 decision tickets 及其阻塞关系。返回
          map_reference 和 requires_wayfinding=true。如果路线已经清晰且工作不需要 Wayfinder
          map，返回稳定的当前规划上下文引用并将 requires_wayfinding 设为 false。本节点不得实现产品代码。


          完成任务后在会话中说明已核验的结果和相关产物。用户点击“完成”后，由交付子 Agent 根据本次对话与实际产物整理符合
          output_schema 的结构化结果；材料缺失时保留对话供补充。
        output_schema: *a2
  - id: select-decisions
    name: 选择全部决策票
    type: dag
    input_schema: &a3
      map_reference: string
    output_schema: &a4
      map_reference: string
      tickets:
        type: array
        items:
          type: object
          properties:
            key: string
            map_reference: string
            ticket_reference: string
    dag:
      - id: select-decisions-session
        name: 选择全部决策票-session
        type: node
        node_kind: agent
        input_schema: *a3
        prompt: >-
          本次输入：

          map_reference: {{ map_reference }}


          调用 $.wayfinder，读取 map_reference 指向的完整地图，一次返回当前全部开放 decision
          tickets，不在此处按 blocker 过滤。当前 map 只由本 workflow 创建和处理，不需要 claim、assignee
          或跨 workflow 并发控制。tickets 中每一项显式提供稳定且同批唯一的 key，值须符合 ^[a-z0-9]+(?:[._-][a-z0-9]+)*$，不得直接使用带大写或斜杠的 tracker 编号，并携带 map_reference 和
          ticket_reference。只返回严格符合 output_schema 的结果，不要开始讨论任何 ticket。


          完成任务后在会话中说明已核验的结果和相关产物。用户点击“完成”后，由交付子 Agent 根据本次对话与实际产物整理符合
          output_schema 的结构化结果；材料缺失时保留对话供补充。
        output_schema: *a4
  - id: decision-tree
    name: 决策票递归树
    type: dag
    input_schema:
      map_reference: string
      ticket_reference: string
    output_schema: {}
    description: 处理一个 decision ticket；发现新的前置决策时，递归分裂出 blocker tickets 和当前 ticket 的
      continuation。
    dag:
      - id: process-decision
        name: 处理单个决策票
        type: dag
        input_schema: &a5
          map_reference: string
          ticket_reference: string
        output_schema: &a6
          continue_decision: boolean
          next_tickets:
            type: array
            items:
              type: object
              properties:
                key: string
                map_reference: string
                ticket_reference: string
        dag:
          - id: process-decision-session
            name: 处理单个决策票-session
            type: node
            node_kind: agent
            input_schema: *a5
            prompt: >-
              本次输入：

              map_reference: {{ map_reference }}

              ticket_reference: {{ ticket_reference }}


              调用 $.wayfinder，使用“Work through the map”模式处理 ticket_reference 指向的单个
              decision ticket。如果 tracker 显示该 ticket 仍被其他 ticket
              阻塞，不要提交节点结果，也不要绕过 blocker；等待同一 workflow 中的 blocker
              完成后重新检查，或者请求人工介入，并在当前 chat 中继续。ticket 可处理时，根据类型调用
              $.research、$.prototype，或同时调用 $.grilling 和
              $.domain-modeling。若决策已经解决，记录 resolution、关闭或重新划定 ticket 范围、更新
              map，并返回 next_tickets=[] 和 continue_decision=false。若讨论发现新的前置决策，创建新的
              blocker tickets 并写入 tracker，同时保持当前 ticket open；返回的 next_tickets
              必须包含每个新 blocker，还必须包含一个指向当前 ticket 的 continuation 项，并返回
              continue_decision=true。next_tickets 的每项 key 同样须符合上述小写 ASCII 标识规则；continuation 使用新的唯一 key，但 ticket_reference
              仍指向当前 ticket；它启动后应按照前述规则等待 blocker 完成。不得实现 destination 本身。


              完成任务后在会话中说明已核验的结果和相关产物。用户点击“完成”后，由交付子 Agent 根据本次对话与实际产物整理符合
              output_schema 的结构化结果；材料缺失时保留对话供补充。
            output_schema: *a6
      - id: split-decision
        name: 分裂决策票
        type: edge
        from: process-decision
        to: decision-tree
        if: continue_decision
        for: next_tickets
  - id: publish-spec
    name: 发布规格
    type: dag
    input_schema: &a7
      map_reference: string
    output_schema: &a8
      spec_reference: string
    dag:
      - id: publish-spec-session
        name: 发布规格-session
        type: node
        node_kind: agent
        input_schema: *a7
        prompt: >-
          本次输入：

          map_reference: {{ map_reference }}


          调用 $.to-spec。将 map_reference 指向的已完成 Wayfinder map、已解决 decision
          tickets、当前对话、仓库领域词汇和相关 ADR 作为规划上下文。确认测试 seam 后，使用该 skill 的模板综合并发布
          spec。不要重新打开已经确定的决策，也不要实现代码。返回已发布 spec 的稳定 spec_reference。


          完成任务后在会话中说明已核验的结果和相关产物。用户点击“完成”后，由交付子 Agent 根据本次对话与实际产物整理符合
          output_schema 的结构化结果；材料缺失时保留对话供补充。
        output_schema: *a8
  - id: publish-tickets
    name: 发布实现票
    type: dag
    input_schema: &a9
      spec_reference: string
    output_schema: &a10
      ticket_set_reference: string
    dag:
      - id: publish-tickets-session
        name: 发布实现票-session
        type: node
        node_kind: agent
        input_schema: *a9
        prompt: >-
          本次输入：

          spec_reference: {{ spec_reference }}


          调用 $.to-tickets 处理 spec_reference 指向的 spec。将工作拆分为 tracer-bullet
          垂直切片，设置真实阻塞关系，并与用户迭代直到粒度和依赖获得确认。发布 tickets 后返回能够稳定恢复实现 frontier 的
          ticket_set_reference。本节点不得实现代码。


          完成任务后在会话中说明已核验的结果和相关产物。用户点击“完成”后，由交付子 Agent 根据本次对话与实际产物整理符合
          output_schema 的结构化结果；材料缺失时保留对话供补充。
        output_schema: *a10
  - id: implementation-loop
    name: 实现循环
    type: dag
    input_schema:
      ticket_set_reference: string
    output_schema: {}
    dag:
      - id: implement-next
        name: 实现下一张票
        type: dag
        input_schema: &a11
          ticket_set_reference: string
        output_schema: &a12
          ticket_set_reference: string
          continue_implementation: boolean
        dag:
          - id: implement-next-session
            name: 实现下一张票-session
            type: node
            node_kind: agent
            input_schema: *a11
            prompt: >-
              本次输入：

              ticket_set_reference: {{ ticket_set_reference }}


              检查 ticket_set_reference 并选择下一个 blocker 均已完成的开放实现 ticket，针对且仅针对该
              ticket 调用 $.implement。按约定使用 TDD，持续运行类型检查和测试，最终运行完整测试套件，调用
              $.code-review，处理必须修复的问题，提交工作并更新 tracker。仍有必要 ticket 时返回
              continue_implementation=true；全部完成时返回
              false。被外部操作或非法依赖阻塞时应请求介入，不得错误地返回完成。


              完成任务后在会话中说明已核验的结果和相关产物。用户点击“完成”后，由交付子 Agent 根据本次对话与实际产物整理符合
              output_schema 的结构化结果；材料缺失时保留对话供补充。
            output_schema: *a12
      - id: continue-implementation
        name: 继续实现循环
        type: edge
        from: implement-next
        to: implementation-loop
        if: continue_implementation
  - id: start-decisions
    name: 开始选择决策票
    type: edge
    from: draw-wayfinder
    to: select-decisions
    if: requires_wayfinding
  - id: dispatch-decisions
    name: 分发全部决策票
    type: edge
    from: select-decisions
    to: decision-tree
    for: tickets
  - id: planning-to-spec
    name: 规划上下文进入规格
    type: edge
    from: draw-wayfinder
    to: publish-spec
  - id: await-decisions
    name: 等待决策森林
    type: edge
    from: decision-tree
    to: publish-spec
  - id: spec-to-tickets
    name: 规格转实现票
    type: edge
    from: publish-spec
    to: publish-tickets
  - id: tickets-to-loop
    name: 实现票转实现循环
    type: edge
    from: publish-tickets
    to: implementation-loop
  - type: edge
    from: collect-workflow-input
    to: draw-wayfinder
