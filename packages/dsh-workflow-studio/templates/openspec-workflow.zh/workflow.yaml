# source: https://github.com/Fission-AI/OpenSpec
# references:
#   - https://github.com/Fission-AI/OpenSpec/blob/main/docs/workflows.md
#   - https://github.com/Fission-AI/OpenSpec/blob/main/docs/commands.md
#   - https://github.com/Fission-AI/OpenSpec/blob/main/docs/agent-contract.md
id: openspec-workflow.zh
name: OpenSpec 规格驱动开发工作流
type: dag
output_schema: {}
description: 使用 OpenSpec 的 OPSX 工作流完成一次规格驱动变更：按需探索，生成并审阅规划产物，在计划修订、实现修复和一致性修订之间递归收敛，最后同步主规格并归档。
dag:
  - id: collect-workflow-input
    type: node
    node_kind: form
    output_schema:
      request: string
    description: 填写本次工作流的真实需求。
  - id: shape-change-request
    type: dag
    input_schema: &a1
      request: string
    output_schema: &a2
      request: string
      exploration_used: boolean
    dag:
      - id: shape-change-request-session
        type: node
        node_kind: session_agent
        input_schema: *a1
        prompt: >-
          本次输入：

          request: {{ request }}


          判断 request 是否已经足以界定一个具体变更。若问题仍模糊、需要调查代码库、比较方案或识别风险，调用
          $.openspec-explore；探索阶段只读取和讨论，不编写产品代码，也不自动创建变更，除非用户明确同意保存探索结果。若需求已经清晰，则不调用该 skill。最终用中文整理出可供提案使用的
          request，保留用户已经确认的范围、约束和验收目标，并返回 exploration_used 表示本次是否实际进行了探索。


          仅在会话中报告实际结果。手动完成只提交空对象；随后由用户在结果表单确认这些业务字段，禁止把会话完成视为结构化输出。
      - id: shape-change-request-result
        type: node
        node_kind: form
        output_schema: *a2
        schema:
          properties:
            request:
              description: 填写会话中已确认的真实结果。
            exploration_used:
              description: 填写会话中已确认的真实结果。
      - type: edge
        from: shape-change-request-session
        to: shape-change-request-result
  - id: propose-openspec-change
    type: dag
    input_schema: &a3
      request: string
    output_schema: &a4
      change_reference: string
    dag:
      - id: propose-openspec-change-session
        type: node
        node_kind: session_agent
        input_schema: *a3
        prompt: >-
          本次输入：

          request: {{ request }}


          调用 $.openspec-propose，根据 request 创建一个 OpenSpec change。遵循当前项目实际启用的 schema 和 OpenSpec CLI
          返回的依赖图、模板与路径，不硬编码产物集合；对于默认 spec-driven schema，通常需要形成 proposal、delta specs、design 和
          tasks。这里只生成实现前所需的规划产物，不修改产品代码。完成后停止在规划边界，将 change 的稳定名称或 openspec/changes/<name> 路径作为
          change_reference 返回。


          仅在会话中报告实际结果。手动完成只提交空对象；随后由用户在结果表单确认这些业务字段，禁止把会话完成视为结构化输出。
      - id: propose-openspec-change-result
        type: node
        node_kind: form
        output_schema: *a4
        schema:
          properties:
            change_reference:
              description: 填写会话中已确认的真实结果。
      - type: edge
        from: propose-openspec-change-session
        to: propose-openspec-change-result
  - id: openspec-change-lifecycle
    type: dag
    input_schema:
      change_reference: string
    output_schema: {}
    description: 审阅当前 change，并根据人类反馈或验证结果修订规划、实施和再次验证；存在缺口时递归开始下一轮，准备完成时同步并归档。
    dag:
      - id: review-planning-artifacts
        type: dag
        input_schema: &a5
          change_reference: string
        output_schema: &a6
          change_reference: string
          planning_disposition: string
          revision_request: string
        dag:
          - id: review-planning-artifacts-session
            type: node
            node_kind: session_agent
            input_schema: *a5
            prompt: >-
              本次输入：

              change_reference: {{ change_reference }}


              读取 change_reference 对应 change 的当前状态和全部已有规划产物，路径与产物 ID 以 openspec status --change <name> --json
              为准。用中文向用户概述变更动机、需求及场景、技术取舍、任务、风险和仍待决定的问题，并确认是否可以进入实现。若用户要求调整，返回
              planning_disposition="revise_plan"，把经确认的修改要求写入 revision_request；若用户明确批准且所有 apply-required
              产物已经就绪，返回 planning_disposition="implement" 和空的 revision_request。不得把沉默当作批准，也不得在本节点修改产物或代码。


              仅在会话中报告实际结果。手动完成只提交空对象；随后由用户在结果表单确认这些业务字段，禁止把会话完成视为结构化输出。
          - id: review-planning-artifacts-result
            type: node
            node_kind: form
            output_schema: *a6
            schema:
              properties:
                change_reference:
                  description: 填写会话中已确认的真实结果。
                planning_disposition:
                  description: 填写会话中已确认的真实结果。
                revision_request:
                  description: 填写会话中已确认的真实结果。
          - type: edge
            from: review-planning-artifacts-session
            to: review-planning-artifacts-result
      - id: revise-planning-artifacts
        type: dag
        input_schema: &a7
          change_reference: string
          revision_request: string
        output_schema: &a8
          planning_revision_reference: string
        dag:
          - id: revise-planning-artifacts-session
            type: node
            node_kind: session_agent
            input_schema: *a7
            prompt: >-
              本次输入：

              change_reference: {{ change_reference }}

              revision_request: {{ revision_request }}


              调用 $.openspec-update-change，按照 revision_request 修订 change_reference
              中已经存在的规划产物，并保持它们相互一致。逐个向用户确认拟议编辑，只写 openspec status
              返回的现有产物路径；不要创建尚不存在的产物，也不要修改产品代码。若修改已经改变了变更的根本意图，应停止并建议新建 change，而不是强行改写当前 change。成功完成后将同一个稳定
              change 引用作为 planning_revision_reference 返回。


              仅在会话中报告实际结果。手动完成只提交空对象；随后由用户在结果表单确认这些业务字段，禁止把会话完成视为结构化输出。
          - id: revise-planning-artifacts-result
            type: node
            node_kind: form
            output_schema: *a8
            schema:
              properties:
                planning_revision_reference:
                  description: 填写会话中已确认的真实结果。
          - type: edge
            from: revise-planning-artifacts-session
            to: revise-planning-artifacts-result
      - id: apply-openspec-change
        type: dag
        input_schema: &a9
          change_reference: string
        output_schema: &a10
          change_reference: string
        dag:
          - id: apply-openspec-change-session
            type: node
            node_kind: session_agent
            input_schema: *a9
            prompt: >-
              本次输入：

              change_reference: {{ change_reference }}


              调用 $.openspec-apply-change 实施 change_reference。先通过 OpenSpec CLI 获取当前 schema 的 apply
              指令、上下文文件和任务状态，再按依赖顺序处理尚未完成的任务；编写代码、运行与改动相称的测试和检查，只有真正完成后才勾选任务。实现中发现规划不准确时不要私自篡改意图，应如实记录并留给后续验证和
              update 回环。遇到阻塞时保留真实状态并请求用户处理，不得虚报完成。返回原 change_reference。


              仅在会话中报告实际结果。手动完成只提交空对象；随后由用户在结果表单确认这些业务字段，禁止把会话完成视为结构化输出。
          - id: apply-openspec-change-result
            type: node
            node_kind: form
            output_schema: *a10
            schema:
              properties:
                change_reference:
                  description: 填写会话中已确认的真实结果。
          - type: edge
            from: apply-openspec-change-session
            to: apply-openspec-change-result
      - id: verify-openspec-change
        type: dag
        input_schema: &a11
          change_reference: string
        output_schema: &a12
          change_reference: string
          verification_disposition: string
          verification_summary: string
        dag:
          - id: verify-openspec-change-session
            type: node
            node_kind: session_agent
            input_schema: *a11
            prompt: >-
              本次输入：

              change_reference: {{ change_reference }}


              调用 $.openspec-verify-change，对照 change_reference 的全部规划产物检查实现的 completeness、correctness 和
              coherence，并在 verification_summary 中用中文记录证据、CRITICAL、WARNING 与建议。若代码或测试未满足已确认的产物，返回
              verification_disposition="fix_implementation"；若实现揭示规划产物已经过时、互相矛盾或必须修订，返回
              "revise_plan"；只有任务、需求场景和设计均有充分实现证据，且用户接受剩余非阻塞 warning 时，才返回 "ready"。本节点只验证和分类，不修改代码或规划产物。


              仅在会话中报告实际结果。手动完成只提交空对象；随后由用户在结果表单确认这些业务字段，禁止把会话完成视为结构化输出。
          - id: verify-openspec-change-result
            type: node
            node_kind: form
            output_schema: *a12
            schema:
              properties:
                change_reference:
                  description: 填写会话中已确认的真实结果。
                verification_disposition:
                  description: 填写会话中已确认的真实结果。
                verification_summary:
                  description: 填写会话中已确认的真实结果。
          - type: edge
            from: verify-openspec-change-session
            to: verify-openspec-change-result
      - id: fix-implementation-gaps
        type: dag
        input_schema: &a13
          change_reference: string
          verification_summary: string
        output_schema: &a14
          implementation_fix_reference: string
        dag:
          - id: fix-implementation-gaps-session
            type: node
            node_kind: session_agent
            input_schema: *a13
            prompt: >-
              本次输入：

              change_reference: {{ change_reference }}

              verification_summary: {{ verification_summary }}


              针对 verification_summary 中属于实现偏差、遗漏或测试覆盖不足的问题，再次调用 $.openspec-apply-change 处理
              change_reference。严格以已经批准的规格、设计和任务为意图来源，补齐实现并运行相关验证；不要借修复之名改变需求或设计。处理完当前可执行缺口后，将同一个稳定 change 引用作为
              implementation_fix_reference 返回，以便进入下一轮人工审阅和验证。


              仅在会话中报告实际结果。手动完成只提交空对象；随后由用户在结果表单确认这些业务字段，禁止把会话完成视为结构化输出。
          - id: fix-implementation-gaps-result
            type: node
            node_kind: form
            output_schema: *a14
            schema:
              properties:
                implementation_fix_reference:
                  description: 填写会话中已确认的真实结果。
          - type: edge
            from: fix-implementation-gaps-session
            to: fix-implementation-gaps-result
      - id: reconcile-plan-after-implementation
        type: dag
        input_schema: &a15
          change_reference: string
          verification_summary: string
        output_schema: &a16
          post_implementation_revision_reference: string
        dag:
          - id: reconcile-plan-after-implementation-session
            type: node
            node_kind: session_agent
            input_schema: *a15
            prompt: >-
              本次输入：

              change_reference: {{ change_reference }}

              verification_summary: {{ verification_summary }}


              调用 $.openspec-update-change，根据 verification_summary 修订 change_reference 中已经存在且与现实不一致的规划产物，确保
              proposal、delta specs、design、tasks 或自定义 schema 产物重新一致。逐项取得用户确认，只修改规划产物，不修改代码；如果变化代表新的意图，应建议另建
              change。完成后返回 post_implementation_revision_reference，后续必须重新审阅并再次 apply，使代码与修订后的计划一致。


              仅在会话中报告实际结果。手动完成只提交空对象；随后由用户在结果表单确认这些业务字段，禁止把会话完成视为结构化输出。
          - id: reconcile-plan-after-implementation-result
            type: node
            node_kind: form
            output_schema: *a16
            schema:
              properties:
                post_implementation_revision_reference:
                  description: 填写会话中已确认的真实结果。
          - type: edge
            from: reconcile-plan-after-implementation-session
            to: reconcile-plan-after-implementation-result
      - id: normalize-repeat-context
        type: dag
        input_schema: &a17
          planning_revision_reference: string
          implementation_fix_reference: string
          post_implementation_revision_reference: string
        output_schema: &a18
          change_reference: string
          continue_lifecycle: boolean
        dag:
          - id: normalize-repeat-context-session
            type: node
            node_kind: session_agent
            input_schema: *a17
            prompt: >-
              本次输入：

              planning_revision_reference: {{ planning_revision_reference }}

              implementation_fix_reference: {{ implementation_fix_reference }}

              post_implementation_revision_reference: {{ post_implementation_revision_reference }}


              三个输入引用在运行时只会有一个存在。选择实际存在的引用并规范化为 change_reference，确认该 change 仍处于 active 状态，然后返回
              continue_lifecycle=true 以启动下一轮审阅、实施和验证。若没有恰好一个引用、change 已被外部归档或状态损坏，不要提交结果；应报告异常并请求人工介入。


              仅在会话中报告实际结果。手动完成只提交空对象；随后由用户在结果表单确认这些业务字段，禁止把会话完成视为结构化输出。
          - id: normalize-repeat-context-result
            type: node
            node_kind: form
            output_schema: *a18
            schema:
              properties:
                change_reference:
                  description: 填写会话中已确认的真实结果。
                continue_lifecycle:
                  description: 填写会话中已确认的真实结果。
          - type: edge
            from: normalize-repeat-context-session
            to: normalize-repeat-context-result
      - id: sync-main-specs
        type: dag
        input_schema: &a19
          change_reference: string
          verification_summary: string
        output_schema: &a20
          change_reference: string
          specs_synced: boolean
        dag:
          - id: sync-main-specs-session
            type: node
            node_kind: session_agent
            input_schema: *a19
            prompt: >-
              本次输入：

              change_reference: {{ change_reference }}

              verification_summary: {{ verification_summary }}


              change_reference 已通过验证。对于长周期或并行变更、需要在归档前单独审阅合并结果等情况，先征得用户同意并调用 $.openspec-sync-specs，把 delta
              specs 智能合并到主 openspec/specs 后返回 specs_synced=true。若无需单独同步，则不调用该 skill，返回
              specs_synced=false，并把同步选择留给 archive；不得用复制文件代替 OpenSpec 的 ADDED、MODIFIED、REMOVED、RENAMED 合并规则。保持
              change 仍为 active 并返回原引用。


              仅在会话中报告实际结果。手动完成只提交空对象；随后由用户在结果表单确认这些业务字段，禁止把会话完成视为结构化输出。
          - id: sync-main-specs-result
            type: node
            node_kind: form
            output_schema: *a20
            schema:
              properties:
                change_reference:
                  description: 填写会话中已确认的真实结果。
                specs_synced:
                  description: 填写会话中已确认的真实结果。
          - type: edge
            from: sync-main-specs-session
            to: sync-main-specs-result
      - id: archive-openspec-change
        type: node
        node_kind: session_agent
        input_schema:
          change_reference: string
          specs_synced: boolean
        output_schema: {}
        prompt: >-
          本次输入：

          change_reference: {{ change_reference }}

          specs_synced: {{ specs_synced }}


          调用 $.openspec-archive-change 完成 change_reference。重新检查产物和任务状态；如果 specs_synced=false 且存在 delta
          specs，向用户展示差异并取得是否同步的明确选择，通常建议同步。使用 OpenSpec 的归档流程执行验证、必要的规格合并和移动，保留完整审计历史到
          openspec/changes/archive/YYYY-MM-DD-<name>/。出现验证、同步、目标冲突或文件移动失败时不得声称成功；只有归档确实完成后才返回空对象 {} 并结束
          workflow。
      - id: review-to-planning-revision
        type: edge
        from: review-planning-artifacts
        to: revise-planning-artifacts
        if: $.planning_disposition == "revise_plan"
      - id: approved-plan-to-implementation
        type: edge
        from: review-planning-artifacts
        to: apply-openspec-change
        if: $.planning_disposition == "implement"
      - id: implementation-to-verification
        type: edge
        from: apply-openspec-change
        to: verify-openspec-change
      - id: verification-to-code-fix
        type: edge
        from: verify-openspec-change
        to: fix-implementation-gaps
        if: $.verification_disposition == "fix_implementation"
      - id: verification-to-plan-reconciliation
        type: edge
        from: verify-openspec-change
        to: reconcile-plan-after-implementation
        if: $.verification_disposition == "revise_plan"
      - id: verified-change-to-spec-sync
        type: edge
        from: verify-openspec-change
        to: sync-main-specs
        if: $.verification_disposition == "ready"
      - id: planning-revision-to-repeat-normalizer
        type: edge
        from: revise-planning-artifacts
        to: normalize-repeat-context
      - id: implementation-fix-to-repeat-normalizer
        type: edge
        from: fix-implementation-gaps
        to: normalize-repeat-context
      - id: plan-reconciliation-to-repeat-normalizer
        type: edge
        from: reconcile-plan-after-implementation
        to: normalize-repeat-context
      - id: repeat-openspec-lifecycle
        type: edge
        from: normalize-repeat-context
        to: openspec-change-lifecycle
        if: $.continue_lifecycle
      - id: spec-sync-to-archive
        type: edge
        from: sync-main-specs
        to: archive-openspec-change
  - id: shaped-request-to-proposal
    type: edge
    from: shape-change-request
    to: propose-openspec-change
  - id: proposal-to-change-lifecycle
    type: edge
    from: propose-openspec-change
    to: openspec-change-lifecycle
  - type: edge
    from: collect-workflow-input
    to: shape-change-request
