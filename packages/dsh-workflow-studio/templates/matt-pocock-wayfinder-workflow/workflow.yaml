# source: https://github.com/mattpocock/skills
id: matt-pocock-wayfinder-workflow
name: Matt Pocock engineering workflow
type: dag
output_schema: {}
description: Wayfinder selects every open decision ticket on the map in one pass, then independently splits
  and recurses for each ticket when new prerequisite decisions appear.
dag:
  - id: collect-workflow-input
    type: node
    node_kind: form
    output_schema:
      request: string
    description: Enter the actual request for this workflow.
  - id: Chart Wayfinder map
    type: dag
    input_schema: &a1
      request: string
    output_schema: &a2
      map_reference: string
      requires_wayfinding: boolean
    dag:
      - id: Chart Wayfinder map-session
        type: node
        node_kind: session_agent
        input_schema: *a1
        prompt: >-
          Inputs for this task:

          request: {{ request }}


          Call $.wayfinder in "Chart the map" mode for the engineering request. Determine the destination,
          create a Wayfinder map owned only by this workflow, and create the decision tickets and blocking
          relationships that can already be described. Return map_reference and requires_wayfinding=true. If
          the route is already clear and no Wayfinder map is needed, return a stable reference to the current
          planning context and set requires_wayfinding=false. Do not implement product code in this node.


          Report actual results in the conversation. Manual completion submits an empty object; the user then
          confirms the business fields in the result form. Conversation completion is not structured output.
      - id: Chart Wayfinder map-result
        type: node
        node_kind: form
        output_schema: *a2
        schema:
          properties:
            map_reference:
              description: Enter the actual result confirmed in the conversation.
            requires_wayfinding:
              description: Enter the actual result confirmed in the conversation.
      - type: edge
        from: Chart Wayfinder map-session
        to: Chart Wayfinder map-result
  - id: Select all decision tickets
    type: dag
    input_schema: &a3
      map_reference: string
    output_schema: &a4
      map_reference: string
      tickets:
        type: array
        items:
          type: object
          properties:
            key: string
            map_reference: string
            ticket_reference: string
    dag:
      - id: Select all decision tickets-session
        type: node
        node_kind: session_agent
        input_schema: *a3
        prompt: >-
          Inputs for this task:

          map_reference: {{ map_reference }}


          Call $.wayfinder and read the complete map at map_reference. Return every currently open decision
          ticket in one pass; do not filter by blockers here. This workflow alone creates and handles the map,
          so claim, assignee, and cross-workflow concurrency controls are unnecessary. Give each item in
          tickets a stable unique key plus map_reference and ticket_reference. Return only a result that
          strictly matches output_schema; do not discuss any ticket yet.


          Report actual results in the conversation. Manual completion submits an empty object; the user then
          confirms the business fields in the result form. Conversation completion is not structured output.
      - id: Select all decision tickets-result
        type: node
        node_kind: form
        output_schema:
          result_json: string
        schema:
          properties:
            result_json:
              description: 'Enter the complete JSON object confirmed in the conversation. Fields and types:
                {"map_reference":"string","tickets":{"type":"array","items":{"type":"object","properties":{"key":"string","map_reference":"string","ticket_reference":"string"}}}}'
        uiSchema:
          result_json:
            ui:widget: textarea
      - type: edge
        from: Select all decision tickets-session
        to: Select all decision tickets-result
      - id: Select all decision tickets-json
        type: node
        node_kind: bash
        command: printf '%s' {{ result_json }}
        is_auto_start: true
        input_schema:
          result_json: string
        output_schema: *a4
      - type: edge
        from: Select all decision tickets-result
        to: Select all decision tickets-json
  - id: Decision-ticket recursion tree
    type: dag
    input_schema:
      map_reference: string
      ticket_reference: string
    output_schema: {}
    description: Handle one decision ticket. When new prerequisite decisions appear, recursively split into
      blocker tickets and a continuation of the current ticket.
    dag:
      - id: Handle one decision ticket
        type: dag
        input_schema: &a5
          map_reference: string
          ticket_reference: string
        output_schema: &a6
          continue_decision: boolean
          next_tickets:
            type: array
            items:
              type: object
              properties:
                key: string
                map_reference: string
                ticket_reference: string
        dag:
          - id: Handle one decision ticket-session
            type: node
            node_kind: session_agent
            input_schema: *a5
            prompt: >-
              Inputs for this task:

              map_reference: {{ map_reference }}

              ticket_reference: {{ ticket_reference }}


              Call $.wayfinder in "Work through the map" mode for the single decision ticket at
              ticket_reference. If the tracker shows another ticket still blocks it, do not submit a node
              result or bypass the blocker; wait for the blocker in this workflow to finish, recheck, or
              request human intervention and continue in the current chat. When the ticket is actionable, call
              $.research or $.prototype according to its type, or call both $.grilling and $.domain-modeling.
              If the decision is resolved, record the resolution, close or rescope the ticket, update the map,
              and return next_tickets=[] and continue_decision=false. If discussion reveals new prerequisite
              decisions, create blocker tickets in the tracker and keep the current ticket open. next_tickets
              must include every new blocker and one continuation pointing to the current ticket; return
              continue_decision=true. The continuation gets a new unique key, but ticket_reference still
              points to the current ticket. When it starts, it must wait for blockers as described above. Do
              not implement the destination itself.


              Report actual results in the conversation. Manual completion submits an empty object; the user
              then confirms the business fields in the result form. Conversation completion is not structured
              output.
          - id: Handle one decision ticket-result
            type: node
            node_kind: form
            output_schema:
              result_json: string
            schema:
              properties:
                result_json:
                  description: 'Enter the complete JSON object confirmed in the conversation. Fields and types:
                    {"continue_decision":"boolean","next_tickets":{"type":"array","items":{"type":"object","properties":{"key":"string","map_reference":"string","ticket_reference":"string"}}}}'
            uiSchema:
              result_json:
                ui:widget: textarea
          - type: edge
            from: Handle one decision ticket-session
            to: Handle one decision ticket-result
          - id: Handle one decision ticket-json
            type: node
            node_kind: bash
            command: printf '%s' {{ result_json }}
            is_auto_start: true
            input_schema:
              result_json: string
            output_schema: *a6
          - type: edge
            from: Handle one decision ticket-result
            to: Handle one decision ticket-json
      - id: Split decision ticket
        type: edge
        from: Handle one decision ticket
        to: Decision-ticket recursion tree
        if: $.continue_decision
        for: $.next_tickets
  - id: Publish specification
    type: dag
    input_schema: &a7
      map_reference: string
    output_schema: &a8
      spec_reference: string
    dag:
      - id: Publish specification-session
        type: node
        node_kind: session_agent
        input_schema: *a7
        prompt: >-
          Inputs for this task:

          map_reference: {{ map_reference }}


          Call $.to-spec. Use the completed Wayfinder map at map_reference, resolved decision tickets, current
          conversation, repository domain vocabulary, and relevant ADRs as planning context. After identifying
          the testing seam, synthesize and publish a spec using the skill's template. Do not reopen settled
          decisions or implement code. Return the stable spec_reference of the published spec.


          Report actual results in the conversation. Manual completion submits an empty object; the user then
          confirms the business fields in the result form. Conversation completion is not structured output.
      - id: Publish specification-result
        type: node
        node_kind: form
        output_schema: *a8
        schema:
          properties:
            spec_reference:
              description: Enter the actual result confirmed in the conversation.
      - type: edge
        from: Publish specification-session
        to: Publish specification-result
  - id: Publish implementation tickets
    type: dag
    input_schema: &a9
      spec_reference: string
    output_schema: &a10
      ticket_set_reference: string
    dag:
      - id: Publish implementation tickets-session
        type: node
        node_kind: session_agent
        input_schema: *a9
        prompt: >-
          Inputs for this task:

          spec_reference: {{ spec_reference }}


          Call $.to-tickets for the spec at spec_reference. Split the work into tracer-bullet vertical slices,
          set real blocking relationships, and iterate with the user until granularity and dependencies are
          confirmed. After publishing tickets, return ticket_set_reference, which must allow the
          implementation frontier to be resumed reliably. Do not implement code in this node.


          Report actual results in the conversation. Manual completion submits an empty object; the user then
          confirms the business fields in the result form. Conversation completion is not structured output.
      - id: Publish implementation tickets-result
        type: node
        node_kind: form
        output_schema: *a10
        schema:
          properties:
            ticket_set_reference:
              description: Enter the actual result confirmed in the conversation.
      - type: edge
        from: Publish implementation tickets-session
        to: Publish implementation tickets-result
  - id: Implementation loop
    type: dag
    input_schema:
      ticket_set_reference: string
    output_schema: {}
    dag:
      - id: Implement next ticket
        type: dag
        input_schema: &a11
          ticket_set_reference: string
        output_schema: &a12
          ticket_set_reference: string
          continue_implementation: boolean
        dag:
          - id: Implement next ticket-session
            type: node
            node_kind: session_agent
            input_schema: *a11
            prompt: >-
              Inputs for this task:

              ticket_set_reference: {{ ticket_set_reference }}


              Inspect ticket_set_reference and select the next open implementation ticket whose blockers are
              complete. Call $.implement for that ticket and only that ticket. Use TDD as agreed, run type
              checks and tests continuously, run the full test suite at the end, call $.code-review, fix
              required findings, commit the work, and update the tracker. Return continue_implementation=true
              while necessary tickets remain; return false when all are done. Request intervention if external
              actions or invalid dependencies block progress; never falsely report completion.


              Report actual results in the conversation. Manual completion submits an empty object; the user
              then confirms the business fields in the result form. Conversation completion is not structured
              output.
          - id: Implement next ticket-result
            type: node
            node_kind: form
            output_schema: *a12
            schema:
              properties:
                ticket_set_reference:
                  description: Enter the actual result confirmed in the conversation.
                continue_implementation:
                  description: Enter the actual result confirmed in the conversation.
          - type: edge
            from: Implement next ticket-session
            to: Implement next ticket-result
      - id: Continue implementation loop
        type: edge
        from: Implement next ticket
        to: Implementation loop
        if: $.continue_implementation
  - id: Start selecting decision tickets
    type: edge
    from: Chart Wayfinder map
    to: Select all decision tickets
    if: $.requires_wayfinding
  - id: Dispatch all decision tickets
    type: edge
    from: Select all decision tickets
    to: Decision-ticket recursion tree
    for: $.tickets
  - id: Pass planning context to specification
    type: edge
    from: Chart Wayfinder map
    to: Publish specification
  - id: Wait for the decision forest
    type: edge
    from: Decision-ticket recursion tree
    to: Publish specification
  - id: Turn specification into implementation tickets
    type: edge
    from: Publish specification
    to: Publish implementation tickets
  - id: Turn implementation tickets into the implementation loop
    type: edge
    from: Publish implementation tickets
    to: Implementation loop
  - type: edge
    from: collect-workflow-input
    to: Chart Wayfinder map
