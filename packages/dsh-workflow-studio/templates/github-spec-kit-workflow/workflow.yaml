id: Spec Kit specification-driven development workflow
type: dag
input_schema:
  request: string
output_schema: {}
# source: https://github.com/github/spec-kit
description: Follow the GitHub Spec Kit process from project principles through requirements,
  technical planning, task breakdown, implementation, and convergence checks.
dag:
  - id: Establish project constitution
    type: node
    node_kind: chat
    input_schema:
      request: string
    output_schema:
      request: string
    prompt: Check whether the repository already has a valid Spec Kit project constitution at the
      default location for the installed version. Reuse a complete constitution unless the user
      requests governance changes. Otherwise call $speckit-constitution to create or update it from
      the user's principles, asking about any essential principle that cannot be safely inferred.
      Later Spec Kit skills will read the default constitution themselves; do not pass its path as a
      business parameter. Return the original request unchanged. Do not write a feature
      specification or implement code in this node.
  - id: Write feature specification
    type: node
    node_kind: chat
    input_schema:
      request: string
    output_schema: {}
    prompt: Call $speckit-specify with request as the feature description. The skill must read the
      default project constitution under Spec Kit's conventions and apply its governance
      constraints. Create only one feature directory and its spec.md, focusing on what the user
      needs and why, without implementation details. Follow the active Spec Kit template, record
      reasonable assumptions, keep only clarification questions that materially affect scope or
      experience, and run the built-in specification quality check until it passes or reaches the
      skill's retry limit. Spec Kit records the directory as the active feature; later skills
      resolve it themselves, so do not pass the directory path as a business parameter. Do not
      create a technical plan or implement code in this node.
  - id: Clarify feature specification
    type: node
    node_kind: chat
    input_schema: {}
    output_schema: {}
    prompt: Call $speckit-clarify and locate the current specification through Spec Kit's active-feature
      context. Check for ambiguity or missing decisions that materially affect implementation or
      acceptance. Within the skill's limits, ask only a few highest-priority questions, obtain
      answers one at a time, and write confirmed clarifications back to spec.md and the
      specification quality checklist. If the specification is already clear, do not invent
      questions or make pointless edits. Do not choose a technical plan or implement code in this
      node.
  - id: Review feature specification
    type: node
    node_kind: chat
    input_schema: {}
    output_schema:
      spec_approved: boolean
    prompt: Using Spec Kit's active-feature context, read spec.md and the requirements quality checklist
      produced by $speckit-specify and $speckit-clarify. Show the user the scope, user stories,
      measurable success criteria, assumptions, and remaining warnings, then ask whether technical
      planning may begin. Return spec_approved=true only after explicit user approval; return false
      if the user rejects the specification or $speckit-specify or $speckit-clarify must run again.
      Do not plan or implement code in this node.
  - id: Create technical plan
    type: node
    node_kind: chat
    input_schema: {}
    output_schema: {}
    prompt: Call $speckit-plan for the current active feature. Read the approved spec.md and project
      constitution, resolve the active plan template, research unresolved technical questions, and
      create plan.md. Add research.md, data-model.md, contracts/, quickstart.md, or other supporting
      artifacts only as needed. Run constitution gates before and after design, use the real
      repository and technical context, and keep the plan traceable to the feature specification. Do
      not create tasks or application code in this node.
  - id: Review technical plan
    type: node
    node_kind: chat
    input_schema: {}
    output_schema:
      plan_approved: boolean
    prompt: Using Spec Kit's active-feature context, read plan.md and supporting design artifacts
      produced by $speckit-plan. Present the architecture, technology choices, interfaces, data
      model, constitution gate results, risks, and explicit tradeoffs, then ask whether task
      breakdown may begin. Return plan_approved=true only after explicit user approval; return false
      if the plan is rejected or needs another $speckit-plan revision. Do not generate tasks or
      implement code in this node.
  - id: Review requirements quality
    type: node
    node_kind: chat
    input_schema: {}
    output_schema: {}
    prompt: Ask whether the active feature needs additional requirements quality checklists for
      security, accessibility, performance, user experience, or other domains. If so, call
      $speckit-checklist once for each confirmed concern. These checklists test the completeness,
      clarity, and consistency of requirements text; they are not implementation tests. Guide human
      review of unfinished items, and never check an item on the reviewer's behalf without
      confirmation. If no custom checklist is needed, retain the built-in requirements checklist and
      continue. Do not create implementation tasks or code in this node.
  - id: Generate implementation tasks
    type: node
    node_kind: chat
    input_schema: {}
    output_schema: {}
    prompt: Call $speckit-tasks for the current active feature. Read spec.md, plan.md, all available
      supporting design artifacts, and the project constitution, then generate a complete tasks.md.
      Organize tasks by independently deliverable user stories; place setup and foundational work
      first; specify exact file paths and consecutive task numbers; represent actual dependencies;
      and mark only safely parallel tasks as parallel. Include test tasks when the specification,
      constitution, or user explicitly requires TDD. Do not execute tasks in this node.
  - id: Analyze artifact consistency
    type: node
    node_kind: chat
    input_schema: {}
    output_schema:
      implementation_approved: boolean
    prompt: After tasks.md exists for the active feature, call $speckit-analyze for a strictly read-only
      consistency analysis across spec.md, plan.md, tasks.md, and the project constitution. Report
      inconsistencies, duplication, ambiguity, coverage gaps, and constitution conflicts by severity
      with traceable locations. Do not silently edit artifacts. Return implementation_approved=false
      for critical issues or if the user rejects remaining issues, and recommend the upstream skill
      or manual revision needed. Return implementation_approved=true only when the artifacts are
      sufficiently consistent and the user explicitly approves implementation.
  - id: Delivery convergence loop
    type: dag
    input_schema: {}
    output_schema: {}
    description: Implement the current task set, compare code with the specification and plan, append
      missing work, and repeat until no buildable gap remains.
    dag:
      - id: Execute task plan
        type: node
        node_kind: chat
        input_schema: {}
        output_schema: {}
        prompt: Call $speckit-implement for the current active feature. Enforce Spec Kit's checklist gate
          first; if any reviewer-owned checklist remains unfinished, ask the user whether to
          continue. Load tasks.md, plan.md, available design artifacts, and the constitution; check
          or create appropriate ignore files; then execute tasks in dependency order and phases,
          parallelizing only tasks marked as safe. Check off tasks only after success, run relevant
          verification, and report progress and blockers honestly.
      - id: Evaluate delivery convergence
        type: node
        node_kind: chat
        input_schema: {}
        output_schema:
          continue_delivery: boolean
        prompt: "After implementation, call $speckit-converge for the current active feature. Use only
          spec.md, plan.md, tasks.md, and the constitution as sources of intent. Check the codebase
          for missing, partial, conflicting, or unrequested work. Follow the skill's append-only
          rule: do not rewrite existing tasks or modify application code in this node. Append a
          traceable Convergence phase to tasks.md only when executable gaps remain. Return
          continue_delivery=true if newly appended work must be implemented in another pass; return
          false if the code satisfies all artifacts and tasks.md needs no change."
      - id: Check convergence after implementation
        type: edge
        from: Execute task plan
        to: Evaluate delivery convergence
      - id: Repeat delivery when gaps remain
        type: edge
        from: Evaluate delivery convergence
        to: Delivery convergence loop
        if: $.continue_delivery
  - id: Write specification after constitution
    type: edge
    from: Establish project constitution
    to: Write feature specification
  - id: Clarify after specification
    type: edge
    from: Write feature specification
    to: Clarify feature specification
  - id: Review after clarification
    type: edge
    from: Clarify feature specification
    to: Review feature specification
  - id: Plan after specification approval
    type: edge
    from: Review feature specification
    to: Create technical plan
    if: $.spec_approved
  - id: Review after planning
    type: edge
    from: Create technical plan
    to: Review technical plan
  - id: Review requirements quality after plan approval
    type: edge
    from: Review technical plan
    to: Review requirements quality
    if: $.plan_approved
  - id: Generate tasks after quality review
    type: edge
    from: Review requirements quality
    to: Generate implementation tasks
  - id: Analyze consistency after task generation
    type: edge
    from: Generate implementation tasks
    to: Analyze artifact consistency
  - id: Begin delivery after analysis approval
    type: edge
    from: Analyze artifact consistency
    to: Delivery convergence loop
    if: $.implementation_approved
