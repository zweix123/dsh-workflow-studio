id: openspec-sdd-workflow
type: dag
input_schema:
  request: string
output_schema: {}
# source: https://github.com/Fission-AI/OpenSpec
# references:
#   - https://github.com/Fission-AI/OpenSpec/blob/main/docs/workflows.md
#   - https://github.com/Fission-AI/OpenSpec/blob/main/docs/commands.md
#   - https://github.com/Fission-AI/OpenSpec/blob/main/docs/agent-contract.md
description: "Use the OpenSpec OPSX workflow for a specification-driven change: explore when needed,
  create and review planning artifacts, recursively converge through plan revisions, implementation
  fixes, and consistency checks, then sync the main specs and archive the change."
dag:
  - id: shape-change-request
    type: node
    node_kind: chat
    input_schema:
      request: string
    output_schema:
      request: string
      exploration_used: boolean
    prompt: Decide whether request already defines a concrete change. If it is still vague or requires
      repository investigation, option comparison, or risk discovery, call $.openspec-explore.
      During exploration, only read and discuss; do not write product code or create a change unless
      the user explicitly agrees to save the exploration result. Skip the skill if the request is
      already clear. Summarize a proposal-ready request in English, preserving the confirmed scope,
      constraints, and acceptance goals. Return exploration_used to show whether exploration
      actually occurred.
  - id: propose-openspec-change
    type: node
    node_kind: chat
    input_schema:
      request: string
    output_schema:
      change_reference: string
    prompt: Call $.openspec-propose to create an OpenSpec change from request. Follow the schema enabled
      in this project and the dependency graph, templates, and paths returned by the OpenSpec CLI;
      do not hard-code the artifact set. The default spec-driven schema usually calls for a
      proposal, delta specs, design, and tasks. Generate only planning artifacts needed before
      implementation; do not modify product code. Stop at the planning boundary and return the
      stable change name or openspec/changes/<name> path as change_reference.
  - id: openspec-change-lifecycle
    type: dag
    input_schema:
      change_reference: string
    output_schema: {}
    description: Review the current change; revise plans, implement, and verify again in response to
      human feedback or verification results. Repeat when gaps remain, then sync and archive when
      ready.
    dag:
      - id: review-planning-artifacts
        type: node
        node_kind: chat
        input_schema:
          change_reference: string
        output_schema:
          change_reference: string
          planning_disposition: string
          revision_request: string
        prompt: Read the current state and all existing planning artifacts for change_reference. Use
          openspec status --change <name> --json as the authority for paths and artifact IDs.
          Summarize the motivation, requirements and scenarios, technical tradeoffs, tasks, risks,
          and open decisions to the user in English, then ask whether implementation may begin. If
          the user requests changes, return planning_disposition="revise_plan" with the confirmed
          changes in revision_request. Return planning_disposition="implement" with an empty
          revision_request only after explicit approval and when all apply-required artifacts are
          ready. Do not treat silence as approval or modify artifacts or code in this node.
      - id: revise-planning-artifacts
        type: node
        node_kind: chat
        input_schema:
          change_reference: string
          revision_request: string
        output_schema:
          planning_revision_reference: string
        prompt: Call $.openspec-update-change to revise existing planning artifacts for change_reference
          according to revision_request, keeping them consistent. Confirm proposed edits with the
          user one by one. Write only existing artifact paths returned by openspec status; do not
          create missing artifacts or change product code. If the revision changes the fundamental
          intent, stop and recommend a new change instead of forcing it into the current one. Return
          the same stable change reference as planning_revision_reference after success.
      - id: apply-openspec-change
        type: node
        node_kind: chat
        input_schema:
          change_reference: string
        output_schema:
          change_reference: string
        prompt: Call $.openspec-apply-change for change_reference. First obtain the active schema's apply
          instructions, context files, and task state from the OpenSpec CLI. Then handle unfinished
          tasks in dependency order, write code, run checks and tests suited to the changes, and
          mark tasks complete only after they are done. If implementation exposes an inaccurate
          plan, record it honestly for the later verification and update loop; do not silently
          change the intent. Preserve the real state and ask the user to handle blockers. Do not
          claim unfinished work is complete. Return the original change_reference.
      - id: verify-openspec-change
        type: node
        node_kind: chat
        input_schema:
          change_reference: string
        output_schema:
          change_reference: string
          verification_disposition: string
          verification_summary: string
        prompt: Call $.openspec-verify-change and check implementation against every planning artifact for
          change_reference for completeness, correctness, and coherence. Record evidence, CRITICAL
          and WARNING findings, and recommendations in English in verification_summary. Return
          verification_disposition="fix_implementation" if code or tests fail to satisfy confirmed
          artifacts; return "revise_plan" if implementation reveals outdated, contradictory, or
          otherwise necessary plan revisions. Return "ready" only when tasks, requirement scenarios,
          and design have sufficient implementation evidence and the user accepts any remaining
          non-blocking warnings. This node only verifies and classifies; it does not modify code or
          planning artifacts.
      - id: fix-implementation-gaps
        type: node
        node_kind: chat
        input_schema:
          change_reference: string
          verification_summary: string
        output_schema:
          implementation_fix_reference: string
        prompt: For implementation deviations, omissions, or test gaps in verification_summary, call
          $.openspec-apply-change again for change_reference. Use only the approved specs, design,
          and tasks as the source of intent. Complete the implementation and run relevant checks
          without changing requirements or design under the guise of a fix. After resolving the
          executable gaps, return the same stable change reference as implementation_fix_reference
          for another human review and verification cycle.
      - id: reconcile-plan-after-implementation
        type: node
        node_kind: chat
        input_schema:
          change_reference: string
          verification_summary: string
        output_schema:
          post_implementation_revision_reference: string
        prompt: Call $.openspec-update-change to revise existing planning artifacts for change_reference
          that verification_summary shows are inconsistent with reality. Bring the proposal, delta
          specs, design, tasks, or custom-schema artifacts back into agreement. Obtain user
          confirmation for each edit. Change planning artifacts only, not code; recommend a new
          change if the revision represents new intent. Return
          post_implementation_revision_reference. The next cycle must review and apply the revised
          plan again so the code matches it.
      - id: normalize-repeat-context
        type: node
        node_kind: chat
        input_schema:
          planning_revision_reference: string
          implementation_fix_reference: string
          post_implementation_revision_reference: string
        output_schema:
          change_reference: string
          continue_lifecycle: boolean
        prompt: Exactly one of the three input references should exist at runtime. Select that reference,
          normalize it to change_reference, confirm the change is still active, and return
          continue_lifecycle=true to begin another review, implementation, and verification cycle.
          If there is not exactly one reference, the change was archived externally, or its state is
          damaged, do not submit a result; report the problem and request human intervention.
      - id: sync-main-specs
        type: node
        node_kind: chat
        input_schema:
          change_reference: string
          verification_summary: string
        output_schema:
          change_reference: string
          specs_synced: boolean
        prompt: change_reference has passed verification. For a long-running or parallel change, or when the
          merged result needs separate review before archiving, obtain user consent and call
          $.openspec-sync-specs to merge delta specs intelligently into the main openspec/specs;
          then return specs_synced=true. If separate syncing is unnecessary, skip the skill, return
          specs_synced=false, and leave the sync choice to archive. Do not replace OpenSpec's ADDED,
          MODIFIED, REMOVED, and RENAMED merge rules with file copying. Keep the change active and
          return its original reference.
      - id: archive-openspec-change
        type: node
        node_kind: chat
        input_schema:
          change_reference: string
          specs_synced: boolean
        output_schema: {}
        prompt: Call $.openspec-archive-change to complete change_reference. Recheck artifact and task
          state. If specs_synced=false and delta specs exist, show the differences and obtain an
          explicit choice about syncing; normally recommend syncing. Use OpenSpec's archive flow for
          validation, any required spec merge, and movement to
          openspec/changes/archive/YYYY-MM-DD-<name>/, preserving the audit history. Do not claim
          success if validation, syncing, target conflict, or file movement fails. Return an empty
          object {} and finish the workflow only after archiving actually succeeds.
      - id: review-to-planning-revision
        type: edge
        from: review-planning-artifacts
        to: revise-planning-artifacts
        if: $.planning_disposition == "revise_plan"
      - id: approved-plan-to-implementation
        type: edge
        from: review-planning-artifacts
        to: apply-openspec-change
        if: $.planning_disposition == "implement"
      - id: implementation-to-verification
        type: edge
        from: apply-openspec-change
        to: verify-openspec-change
      - id: verification-to-code-fix
        type: edge
        from: verify-openspec-change
        to: fix-implementation-gaps
        if: $.verification_disposition == "fix_implementation"
      - id: verification-to-plan-reconciliation
        type: edge
        from: verify-openspec-change
        to: reconcile-plan-after-implementation
        if: $.verification_disposition == "revise_plan"
      - id: verified-change-to-spec-sync
        type: edge
        from: verify-openspec-change
        to: sync-main-specs
        if: $.verification_disposition == "ready"
      - id: planning-revision-to-repeat-normalizer
        type: edge
        from: revise-planning-artifacts
        to: normalize-repeat-context
      - id: implementation-fix-to-repeat-normalizer
        type: edge
        from: fix-implementation-gaps
        to: normalize-repeat-context
      - id: plan-reconciliation-to-repeat-normalizer
        type: edge
        from: reconcile-plan-after-implementation
        to: normalize-repeat-context
      - id: repeat-openspec-lifecycle
        type: edge
        from: normalize-repeat-context
        to: openspec-change-lifecycle
        if: $.continue_lifecycle
      - id: spec-sync-to-archive
        type: edge
        from: sync-main-specs
        to: archive-openspec-change
  - id: shaped-request-to-proposal
    type: edge
    from: shape-change-request
    to: propose-openspec-change
  - id: proposal-to-change-lifecycle
    type: edge
    from: propose-openspec-change
    to: openspec-change-lifecycle
