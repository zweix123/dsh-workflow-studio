id: dev-agent.zh
name: 开发 · Agent 节点功能
type: dag
description: 需要宿主已配置模型。提交需求，手动启动台前对话并完成交付，再观察自动启动的台后任务、只读尝试记录与人工确认；不要求修改文件或执行命令。
output_schema:
  report: string
dag:
  - id: 填写讨论需求
    type: node
    node_kind: form
    output_schema:
      request: string
    schema:
      properties:
        request:
          title: 讨论需求
          default: 为新同事设计一个三步项目入门流程。
    uiSchema:
      request:
        ui:widget: textarea
  - id: 台前讨论
    type: node
    node_kind: agent
    mode: foreground
    description: 点击执行后打开对话，继续交流；生成结束后点击完成，以原生结构化输出交付 summary。生成中不能完成。
    input_schema:
      request: string
    output_schema:
      summary: string
    prompt: |
      示例需求：
      {{ request }}

      请用中文给出简短的三步方案，无须修改文件或运行命令。
      用户可以继续讨论；确认后提醒用户返回工坊点击完成。
      summary 是最终方案的简短摘要。
  - id: 台后整理组
    type: dag
    description: 接收台前摘要。内部台后节点就绪后自动执行，产出结果仍须人工确认，确认后才向根 DAG 交付 report。
    input_schema:
      summary: string
    output_schema:
      report: string
    dag:
      - id: 台后整理
        type: node
        node_kind: agent
        mode: background
        is_auto_start: true
        description: 查看只读尝试记录和待确认结果，再点击完成；确认不会重新执行任务。失败或未知结果只能人工重试。
        input_schema:
          summary: string
        output_schema:
          report: string
        prompt: |
          已确认的方案摘要：
          {{ summary }}

          整理为简短的中文执行清单，不增加任务，不修改文件或运行命令。
          使用 structured_output 提交 report 字符串。
  - type: edge
    from: 填写讨论需求
    to: 台前讨论
  - type: edge
    from: 台前讨论
    to: 台后整理组
