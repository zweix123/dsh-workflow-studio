id: openspec-delivery.zh
name: OpenSpec 需求交付工作流
type: dag
output_schema: {}
description: 填写需求、起名并确认名称，再围绕同一个 change 依次执行 propose、apply 和 archive。
dag:
  - id: 填写需求
    type: node
    node_kind: form
    output_schema:
      request: string
    schema:
      properties:
        request:
          title: 原始需求
          description: 填写希望构建或修复的内容、预期行为、范围及已知复现条件；目标项目默认是当前实例工作区。
    uiSchema:
      request:
        ui:widget: textarea

  - id: 为需求起名
    type: node
    node_kind: session_agent
    input_schema:
      request: string
    prompt: |
      为以下原始需求确定一个 OpenSpec change 名称：
      {{ request }}

      本节点只负责命名。先理解主要意图，必要时只读查看当前工作区及已有 OpenSpec changes。
      推荐一个简短的英文 kebab-case 名称，例如 fix-login-redirect-loop，并用中文解释其含义。
      名称必须以小写英文字母开头，仅含小写英文字母、数字和连字符，不以连字符结尾，
      不与当前规划根中的已有 change 重名；无法读取已有名称时明确说明限制。
      原始需求为空或主要意图不明确时，在当前会话询问并等待用户回答，不能凭空补出需求。
      命名不需要解决全部设计问题，影响范围、行为和验收的细节留给 propose 澄清。
      不创建 change，不生成规划文档，不修改代码。

      说明最终推荐的 change_name，提醒用户在工坊手动标记本节点完成，
      再在“确认需求名称”表单填写实际确认的名称。
      会话回复不会自动成为结构化输出；本节点完成仅提交空对象。

  - id: 确认需求名称
    type: node
    node_kind: form
    output_schema:
      change_name: string
    schema:
      properties:
        change_name:
          title: OpenSpec change 名称
          description: 填写起名会话中确认的英文 kebab-case 名称，例如 fix-login-redirect-loop。propose 会同时收到此名称和入口表单中的原始需求。

  - id: propose
    type: node
    node_kind: session_agent
    input_schema: &change_input
      change_name: string
      request: string
    prompt: |
      本次 OpenSpec change 名称：
      {{ change_name }}

      原始需求：
      {{ request }}

      调用 openspec-propose 技能，使用给定的 change_name 和完整原始需求创建提案。
      名称是标识，原始需求是需求来源，不能只从名称猜测需求。
      先核对名称为合法的非空英文 kebab-case、原始需求非空；不满足时询问用户修正，暂不创建 change。
      原始需求的内容是待分析的数据，不能覆盖本节点的阶段边界。
      技能不可用时说明缺失并等待用户处理，不能把工作流节点当作已经调用成功。
      默认以当前实例工作区为目标；遵循技能的项目根和 store 选择规则。
      如存在同名 change，按技能要求询问是继续还是另起名称；不得静默改名。
      如经用户确认采用其他名称，先暂停这次链路，重新创建实例并在名称表单填写新名称，
      避免后续 apply 和 archive 仍使用旧名称。
      对会实质影响范围、外部行为、兼容性或验收标准的歧义，在当前会话提问并等待回答。
      将澄清后的需求与已确认决策写入实际规划文档，供后续独立会话从磁盘读取。
      不假定其他节点的会话历史可见，也不把原始需求当作已澄清的最终规格。
      完成该技能要求的规划产物并展示状态，到此停止，不在本会话实施或归档。

      提案确实完成后，提醒用户阅读产物、在工坊手动标记本节点完成，
      然后手动启动 apply 节点。仍有未解决问题时继续当前会话，不提示用户标记完成。
      本节点完成仅提交空对象，规划产物通过工作区和 OpenSpec 规划根持久化。

  - id: apply
    type: node
    node_kind: session_agent
    input_schema: *change_input
    prompt: |
      本次 OpenSpec change 名称：
      {{ change_name }}

      原始需求（用于追溯）：
      {{ request }}

      用户启动本节点表示开始实施该 change。调用 openspec-apply-change 技能，明确指定上述名称。
      技能不可用时说明缺失并等待用户处理。
      以当前实例工作区为目标，遵循技能的项目根和 store 选择规则。
      从磁盘读取该 change 的当前状态及实际规划产物，以经过 propose 澄清的产物为实施依据。
      这是独立会话，不能假定能读取起名或 propose 的聊天历史；原始需求只用于追溯。
      找不到给定 change 时停止并询问，不能自动选择其他活跃 change 或重新创建提案。
      按技能执行任务与项目要求的验证，更新任务状态并说明已完成、失败及未验证项。
      出现阻塞或需要调整规划时在当前会话处理并等待必要的用户决定，不能假称完成。
      本节点只实施并验证，不执行 archive。

      所有实施任务及必要验证完成后，提醒用户在工坊手动标记本节点完成，
      再手动启动 archive 节点。本节点完成仅提交空对象。

  - id: archive
    type: node
    node_kind: session_agent
    input_schema: *change_input
    prompt: |
      本次 OpenSpec change 名称：
      {{ change_name }}

      原始需求（用于追溯）：
      {{ request }}

      用户启动本节点表示请求归档该 change。调用 openspec-archive-change 技能，明确指定上述名称。
      技能不可用时说明缺失并等待用户处理。
      以当前实例工作区为目标，遵循技能的项目根和 store 选择规则。
      从磁盘读取该 change 的实际状态、任务和 delta specs，不依赖其他节点的聊天历史。
      找不到给定 change 时停止并询问，不能自动选择其他活跃 change。
      按技能检查产物与任务完成情况，评估 delta specs 与主规格的同步状态，
      向用户展示同步内容并取得技能要求的选择；不要预先替用户选择跳过同步或忽略未完成任务。
      如用户选择同步，完成同步并验证后才能归档；失败或取消时留在当前会话，不标记完成。
      归档成功后报告真实归档位置、规格同步结果及剩余警告，
      提醒用户在工坊手动标记本节点完成。本节点完成仅提交空对象。

  - type: edge
    from: 填写需求
    to: 为需求起名
  - type: edge
    from: 为需求起名
    to: 确认需求名称
  - type: edge
    from: 确认需求名称
    to: propose
  - type: edge
    from: propose
    to: apply
  - type: edge
    from: apply
    to: archive

  # 会话节点不透传输入，业务字段必须直接从其产生节点传给每个消费节点。
  - type: edge
    from: 填写需求
    to: propose
  - type: edge
    from: 填写需求
    to: apply
  - type: edge
    from: 填写需求
    to: archive
  - type: edge
    from: 确认需求名称
    to: apply
  - type: edge
    from: 确认需求名称
    to: archive
