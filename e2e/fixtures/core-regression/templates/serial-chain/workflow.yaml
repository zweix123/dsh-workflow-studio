id: regression-serial-chain
name: 串行链跨节点依赖回归
type: dag
dag:
  - id: collect-request
    name: 填写需求
    type: node
    node_kind: form
    output_schema:
      request: string
    schema:
      properties:
        request:
          title: 原始需求
    uiSchema:
      request:
        ui:widget: textarea
  - id: plan-change
    name: 澄清需求与生成方案
    type: node
    node_kind: bash
    input_schema:
      request: string
    output_schema:
      change_name: string
    command: printf '{"change_name":"fix-layout"}'
  - id: implement-verify
    name: 实施与验证
    type: node
    node_kind: bash
    input_schema:
      change_name: string
    command: ""
  - id: sync-archive
    name: 同步规格与归档
    type: node
    node_kind: bash
    input_schema:
      change_name: string
    command: ""
  - { type: edge, from: collect-request, to: plan-change }
  - { type: edge, from: plan-change, to: implement-verify }
  - { type: edge, from: implement-verify, to: sync-archive }
  - { type: edge, from: plan-change, to: sync-archive }
